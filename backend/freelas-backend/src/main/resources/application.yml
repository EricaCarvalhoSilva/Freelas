# Configuração do backend do Freelas.
# Valores sensíveis vêm de variáveis de ambiente (documento "Definição de Ambientes e
# Gestão de Segredos"). Os padrões abaixo servem só para rodar na máquina de desenvolvimento.
spring:
  application:
    name: freelas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freelas}
    username: ${DB_USUARIO:freelas}
    password: ${DB_SENHA:freelas}
  jpa:
    open-in-view: false
    hibernate:
      # O Flyway cria as tabelas; o Hibernate só confere se as entidades batem com o banco
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    # Mensagens do Bean Validation em português
    locale: pt_BR
    locale-resolver: fixed
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORTA:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# Regras do negócio. Os documentos do grupo ainda não fixam alguns números;
# os valores abaixo são propostas e podem ser trocados sem mexer no código.
freelas:
  seguranca:
    # Segredo do token de acesso (HS256). Em produção: variável de ambiente com 32+ caracteres.
    jwt-segredo: ${JWT_SEGREDO:troque-este-segredo-de-desenvolvimento-freelas-2026}
    token-acesso-minutos: 15        # Padrão da API e Segurança, 3.2
    token-renovacao-inatividade-minutos: 30
    token-renovacao-maximo-dias: 7
    codigo-email-minutos: 15        # RNF06
    # Chave AES-256 (Base64, 32 bytes) para chave Pix e dados bancários (RNF21)
    chave-criptografia: ${CHAVE_CRIPTOGRAFIA:ZnJlZWxhcy1jaGF2ZS1kZXYtMzItYnl0ZXMtYWVzISE=}
    # Segredo da assinatura HMAC dos webhooks do gateway
    webhook-segredo: ${WEBHOOK_SEGREDO:segredo-webhook-desenvolvimento}
  regras:
    taxa-plataforma-percentual: 10   # comissão do split (não definida nos documentos)
    valor-minimo-hora: 15.00         # KAN-69 RN04 (mínimo da plataforma, proposta)
    valor-minimo-turno: 80.00
    valor-minimo-diaria: 120.00
    idade-minima: 18
    janela-confirmacao-pagamento-horas: 6   # Fluxo de pagamento (Luan)
    janela-avaliacao-horas: 72              # Avaliação e reputação
    contestacao-dias-uteis: 5
    quarentena-conta-recebimento-horas: 24  # RN-CART-16
    cancelamento-antecedencia-horas: 24     # KAN-70 RN12
    suspensao-no-show-dias: 7
    acesso-antecipado-premium-minutos: 15
    raio-padrao-substituicao-km: 10
    checkin-antecedencia-minutos: 60
  admin:
    # Se preenchidos, cria o primeiro Administrador ao subir a aplicação
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  worker:
    intervalo-ms: 2000
    lote: 20
